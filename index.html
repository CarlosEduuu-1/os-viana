<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O.S. Shineray Viana</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <p class="brand">Shineray Viana · Ordem de Serviço</p>

  <section class="card" id="stepPage">
    <div class="progress" id="progress" aria-hidden="true"></div>
    <p class="count"><span id="count"></span><span class="tag" id="tag" hidden>opcional</span></p>
    <h1 id="title"></h1>
    <p class="hint" id="hint"></p>
    <div id="body"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="row">
      <button type="button" class="ghost" id="back">Voltar</button>
      <button type="button" class="grow" id="next" disabled>Avançar</button>
    </div>
  </section>

  <section id="sheetPage" hidden>
    <div class="card">
      <div class="noprint">
        <h1>Ordem de serviço pronta</h1>
        <p class="hint">Confira o formulário abaixo. Se estiver certo, imprima ou salve em PDF.</p>
        <div class="row" style="margin: 0 0 20px;">
          <button type="button" class="grow" id="printBtn">Imprimir / Salvar em PDF</button>
          <button type="button" class="ghost" id="newBtn">Nova ordem</button>
        </div>
      </div>
      <div class="sheetbox">
        <svg id="sheet" viewBox="0 0 1136.76 1629.38" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ordem de serviço preenchida">
          <image href="formulario.jpg" x="0" y="0" width="1136.76" height="1629.38"/>
          <g id="overlay" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0b1f4d"></g>
        </svg>
      </div>
      <div class="noprint">
        <ul class="answers" id="answers"></ul>
        <p class="tip">Na janela de impressão, escolha "Salvar como PDF" no destino para gerar o arquivo. Use papel A4 e escala 100%.</p>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
